name: Independent verifier checks
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Correct solution must pass
        run: python ai_verify.py --candidate examples/fixed.py --spec specs/usernames.json
      - name: Buggy solution must fail with code 1
        shell: bash
        run: |
          set +e
          python ai_verify.py --candidate examples/buggy.py --spec specs/usernames.json
          status=$?
          set -e
          test "$status" -eq 1
